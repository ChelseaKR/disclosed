# Keeps the two dependency surfaces current: the dev toolchain locked in uv.lock (the project
# has no runtime dependencies) and the SHA-pinned GitHub Actions. Grouped so a week's bumps
# arrive as one reviewable PR, not five.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      dev-toolchain:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
