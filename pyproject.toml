[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "disclosed"
version = "0.1.0.dev0"
description = "Grades US higher-education institutions on what they disclose, not on how they perform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Chelsea Kelly-Reif" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6",
  "mypy>=1.11",
  "ruff>=0.6",
]

[project.scripts]
disclosed = "disclosed.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/disclosed"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "C90", "UP", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=disclosed --cov-branch --cov-fail-under=90"

[tool.coverage.run]
source = ["src/disclosed"]
